<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2f8af5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5ca3;stop-opacity:1" />
    </linearGradient>

    <style>
      /* --- ANIMAÇÕES --- */
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Pulso do núcleo */
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.85); opacity: 0.8; }
      }

      /* Truque para Chrome vs Firefox */
      @keyframes vanish {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes appear {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      /* Camada Estática (O Cubo sem fundo) */
      .static-layer {
        /* No Firefox, essa camada some instantaneamente */
        animation: vanish 0.01s linear forwards; 
      }

      /* Camada Animada (O Spinner com fundo) */
      .animated-layer {
        opacity: 0; /* Começa invisível pro Chrome não ver */
        transform-origin: center;
        /* No Firefox, aparece e começa a girar */
        animation: appear 0.01s linear forwards;
      }

      .heavy-spinner {
        transform-origin: center;
        animation: spin 3s linear infinite;
      }
      
      .core-pulse {
        transform-origin: center;
        transform-box: fill-box;
        animation: pulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="static-layer" transform="translate(50 50) scale(1.2) translate(-32 -32)">
     <g fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 4 L54 16 L32 28 L10 16 Z" />
        <path d="M10 16 L10 40 L32 52 M54 16 L54 40 L32 52" />
        <path d="M32 28 L32 52" />
        <circle cx="32" cy="4" r="3" fill="#ffffff" stroke="none"/>
        <circle cx="54" cy="16" r="3" fill="#ffffff" stroke="none"/>
        <circle cx="10" cy="16" r="3" fill="#ffffff" stroke="none"/>
        <circle cx="32" cy="28" r="3" fill="#ffffff" stroke="none"/>
        <circle cx="32" cy="52" r="3" fill="#2f8af5" stroke="none"/>
     </g>
  </g>

  <g class="animated-layer">
    <rect width="100" height="100" rx="25" fill="#060910" />
    
    <circle cx="50" cy="50" r="18" fill="#2f8af5" class="core-pulse" />
    <circle cx="50" cy="50" r="8" fill="#ffffff" class="core-pulse" />

    <g class="heavy-spinner">
      <circle cx="50" cy="50" r="36" fill="none" stroke="#2f8af5" stroke-width="12" stroke-dasharray="60 160" stroke-linecap="round" />
      <circle cx="50" cy="50" r="36" fill="none" stroke="#2f8af5" stroke-width="12" stroke-dasharray="30 190" stroke-dashoffset="-110" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>

</svg>
